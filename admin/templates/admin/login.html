<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Masuk Admin | MTsN 1 Karanganyar</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin.css', v='44') }}">
  </head>
  <body class="login-body">
    <main class="login-layout">
      <section class="login-visual" aria-label="Identitas MTs Negeri 1 Karanganyar">
        <img class="login-visual-image" src="{{ url_for('static', filename='uploads/content/hero-madrasah.jpg') }}" alt="Gedung MTs Negeri 1 Karanganyar">
        <a class="admin-brand login-brand login-visual-brand" href="{{ url_for('login') }}">
          <span><strong>MTs Negeri 1</strong><small>Karanganyar</small></span>
        </a>
      </section>
      <section class="login-panel" aria-labelledby="login-title">
        <div class="login-card">
          <span class="login-kicker">ADMINISTRATOR</span>
          <h1 id="login-title">Masuk ke Admin</h1>
          <p class="login-description">Gunakan akun administrator untuk melanjutkan.</p>
          {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
          {% endif %}
          <form method="post" action="{{ url_for('login') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button class="button-primary login-submit" type="submit">Masuk</button>
          </form>
        </div>
      </section>
    </main>
  </body>
</html>
